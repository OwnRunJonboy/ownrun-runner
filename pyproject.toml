[project]
name = "ownrun-runner"
version = "0.1.0"
description = "OwnRun home runner — polls for jobs and runs Ollama locally"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
ownrun-runner = "ownrun_runner.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ownrun_runner*"]
